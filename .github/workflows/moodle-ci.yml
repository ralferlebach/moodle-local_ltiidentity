name: Moodle Plugin CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  phpcs:
    name: "PHPCS / PHP ${{ matrix.php }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci '^4'
          echo "$GITHUB_WORKSPACE/ci/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Run PHPCS
        run: moodle-plugin-ci phpcs plugin

      - name: Run PHP lint
        run: |
          find plugin -name "*.php" -print0 | xargs -0 -n1 php -l

  phpunit:
    name: "PHPUnit / ${{ matrix.moodle }} / PHP 8.3"
    runs-on: ubuntu-24.04
    needs: phpcs
    strategy:
      fail-fast: false
      matrix:
        moodle:
          - MOODLE_405_STABLE
          - MOODLE_500_STABLE
          - MOODLE_501_STABLE
          - MOODLE_502_STABLE

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: moodle
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, xml, zip, gd, mysqli, pdo_mysql
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci '^4'
          echo "$GITHUB_WORKSPACE/ci/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Install Moodle and plugin
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --branch ${{ matrix.moodle }} \
            --db-type mariadb \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --db-user root \
            --db-pass root \
            --db-name moodle

      - name: Run plugin PHPUnit tests
        run: |
          if [ -d plugin/tests ] && find plugin/tests -name '*_test.php' -print -quit | grep -q .; then
            moodle-plugin-ci phpunit
          else
            echo "No PHPUnit tests found in plugin/tests; skipping."
          fi
